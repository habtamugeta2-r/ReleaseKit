name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: releasekit
          POSTGRES_PASSWORD: releasekit
          POSTGRES_DB: releasekit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U releasekit -d releasekit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://releasekit:releasekit@localhost:5432/releasekit_test?schema=public
      TEST_DATABASE_URL: postgresql://releasekit:releasekit@localhost:5432/releasekit_test?schema=public
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Release tags must use vMAJOR.MINOR.PATCH format.\n' >&2
            exit 1
          fi
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            printf 'Release tags must point to a commit on main.\n' >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Apply migrations to the clean test database
        run: npm run db:migrate:deploy

      - name: Verify migrations on an already migrated database
        run: npm run db:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Enforce frontend coverage thresholds
        run: npm run test:coverage

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.run_id }}
          path: |
            apps/api/test-results/junit.xml
            apps/web/test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Build production apps
        run: npm run build

  containers:
    name: Validate container builds
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build API runtime image
        run: docker buildx build --file apps/api/Dockerfile --target runtime --tag releasekit-api:ci .

      - name: Build migration image
        run: docker buildx build --file apps/api/Dockerfile --target migrator --tag releasekit-migrator:ci .

      - name: Build web runtime image
        run: docker buildx build --file apps/web/Dockerfile --tag releasekit-web:ci .
